<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="100%" role="img" aria-label="五贼制化循环图">
  <defs>
    <style>
      .t{font-family:"Noto Serif SC","Songti SC",serif;fill:#25211D;text-anchor:middle}
      .ttl{font-size:24px;letter-spacing:.14em}
      .sub{font-size:12.5px;fill:#7C6D5C;letter-spacing:.08em}
      .n{font-size:22px;letter-spacing:.05em}
      .cap{font-size:14px;fill:#3B352F;letter-spacing:.05em}
      .ochre{fill:#994433}
      .rul{stroke:#DCD5C8;stroke-width:1}
    </style>
    <marker id="gen" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7C6D5C"/>
    </marker>
  </defs>
  <rect width="820" height="600" fill="#FCFAF6"/>
  <text class="t ttl" x="410" y="44">五 贼 制 化</text>
  <text class="t sub" x="410" y="68">体为五行　用在相克裁制　相生为德　相克为贼</text>
  <line x1="60" y1="86" x2="760" y2="86" class="rul"/>
  <path d="M448.7 140.8 Q529.9 131.0 545.7 211.2" fill="none" stroke="#7C6D5C" stroke-width="1.5" marker-end="url(#gen)"/>
  <path d="M569.6 284.8 Q604.0 359.0 532.6 398.8" fill="none" stroke="#7C6D5C" stroke-width="1.5" marker-end="url(#gen)"/>
  <path d="M469.9 444.3 Q410.0 500.0 350.1 444.3" fill="none" stroke="#7C6D5C" stroke-width="1.5" marker-end="url(#gen)"/>
  <path d="M287.4 398.8 Q216.0 359.0 250.4 284.8" fill="none" stroke="#7C6D5C" stroke-width="1.5" marker-end="url(#gen)"/>
  <path d="M274.3 211.2 Q290.1 131.0 371.3 140.8" fill="none" stroke="#7C6D5C" stroke-width="1.5" marker-end="url(#gen)"/>
  <line x1="420.8" y1="171.3" x2="492.1" y2="390.5" stroke="#994433" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="532.0" y1="267.7" x2="345.4" y2="403.3" stroke="#994433" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="474.6" y1="403.3" x2="288.0" y2="267.7" stroke="#994433" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="327.9" y1="390.5" x2="399.2" y2="171.3" stroke="#994433" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="294.7" y1="247.2" x2="525.3" y2="247.2" stroke="#994433" stroke-width="1.4" stroke-dasharray="6 5"/>
  <circle cx="410.0" cy="138.0" r="31" fill="#E6EFE3" stroke="#7C9B76"/>
  <text class="t n" x="410.0" y="146.0">木</text>
  <circle cx="560.3" cy="247.2" r="31" fill="#F6E2DC" stroke="#B9553F"/>
  <text class="t n" x="560.3" y="255.2">火</text>
  <circle cx="502.9" cy="423.8" r="31" fill="#EFE2CF" stroke="#A98B5E"/>
  <text class="t n" x="502.9" y="431.8">土</text>
  <circle cx="317.1" cy="423.8" r="31" fill="#F2F2EF" stroke="#8A8A82"/>
  <text class="t n" x="317.1" y="431.8">金</text>
  <circle cx="259.7" cy="247.2" r="31" fill="#DDE3E8" stroke="#4E6878"/>
  <text class="t n" x="259.7" y="255.2">水</text>
  <line x1="60" y1="500" x2="760" y2="500" class="rul"/>
  <text class="t cap" x="410" y="528">实线相生：木→火→土→金→水，长养之德</text>
  <text class="t cap ochre" x="410" y="556">虚线相克：木克土、土克水、水克火、火克金、金克木，裁制之贼</text>
  <text class="t sub" x="410" y="582">克非纯害：无克则生而泛滥，裁而后成，害中藏恩</text>
</svg>